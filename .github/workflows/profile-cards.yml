name: GitHub Profile Cards

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN }}
        with:
          USERNAME: Pranith-Jain
          BRANCH_NAME: main
          FOLDER_NAME: profile-summary-card-output
          THEME: tokyo_night
          UTC_OFFSET: 5
