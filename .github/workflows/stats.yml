name: Update profile stats

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name "profile-stats-bot"
      - run: git config user.email "profile-stats-bot@users.noreply.github.com"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stats.mjs
      - run: |
          git add stats/
          if git diff --cached --quiet; then
            echo "no stats changes"
          else
            git commit -m "chore(stats): refresh profile stat cards"
            git push
          fi